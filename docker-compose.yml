services:
  db:
    image: postgres:15-alpine
    container_name: shiplytics_db
    restart: always
    environment:
      POSTGRES_USER: mertcan
      POSTGRES_PASSWORD: gemi_teknik_2026
      POSTGRES_DB: shiplytics
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: shiplytics_redis
    ports:
      - "6379:6379"

volumes:
  postgres_data:
